<div id="mainVizMap">
  <div id="mapSidebar" class="sidebar">
    <div class="colAttributes">
      <div class="rowAttributes" id="vizMapAttributes"></div>
      <div class="rowAttributeSettings" id="vizMapDividers"></div>
      <div class="rowAttributeSettings" id="vizMapDividerFilters"></div>
      <div class="rowGeography" id="vizMapAggregator"></div>
      <!-- Row 3 Chart Selector-->
      <div class="rowChart">
          <!-- Content for the third row -->
      </div>
    </div>
    <div class="colFilters">
      <div class="rowFilters" id="vizMapAttributeFilters"></div>
    </div>
  </div>
  <div id="mainMap">
    <!-- Side-by-side compare (app.js's setupMapCompareSync()/setMapCompareSplitVisible(),
         vizmap.js's setCompRendererAndShow()): two independent MapViews sharing a fixed 50/50
         splitter (not user-draggable), instead of a single view with Esri's Swipe widget - that widget has a
         confirmed bug where its trailingLayers suppresses the other layer's labels, with no
         workaround via the labeling API. Two separate views each label themselves normally
         since neither competes with the other. #mapViewComp/#mapDivider stay hidden (and
         #mapView stays full-width) outside that mode. #mapViewComp ("Compare to") comes first
         in source order so it renders on the left, matching the Scenario Selector's "Compare
         to:" panel being the one being compared TO - #mapView (Main, and all its widgets:
         Scenario Selector/legend/zoom/basemap toggle) stays on the right. -->
    <div id="mapViewRow">
      <div id="mapViewComp" style="display:none;"></div>
      <div id="mapDivider" style="display:none;"></div>
      <div id="mapView"></div>
    </div>
    <div id="mapFooter"></div>
  </div>
  <!-- Scenario Selector/label toggle/Legend (app.js/vizmap.js) - used to float over the map via
       Esri UI widgets (Expand panels, a corner action button); moved here into their own sidebar
       column instead, mirroring #mapSidebar on the other side. Zoom and the basemap toggle stay
       as floating map widgets (bottom-left/bottom-right - see app.js's "ADD BASEMAP TOGGLE"/Zoom
       comments). -->
  <div id="mapSidebarRight" class="map-sidebar-right">
    <div id="mapSidebarRightScenario"></div>
    <div id="mapSidebarRightLabelToggle"></div>
    <div id="mapSidebarRightLegend"></div>
  </div>
</div>
