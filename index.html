<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
        <title>vizTool</title>

        <link rel="stylesheet" href="https://js.arcgis.com/4.27/esri/themes/light/main.css">
        <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/calcite-components/1.8.0/calcite.css" />
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.1.0/css/all.css">

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <script src="https://js.arcgis.com/4.27/"></script>
        <script type="module" src="https://js.arcgis.com/calcite-components/1.8.0/calcite.esm.js"></script>
        <link rel="stylesheet" href="app/styles.css">

        <script src="app/app.js"></script>
        <script src="app/model-entity.js"></script>
        <script src="app/menu-item.js"></script>
        <script src="app/url-state.js"></script>

        <script src="app/layouts/attribute.js"></script>
        <script src="app/layouts/card.js"></script>
        <script src="app/layouts/measure.js"></script>
        <script src="app/layouts/aggregator.js"></script>
        <script src="app/layouts/divider.js"></script>
        <script src="app/layouts/filter.js"></script>
        <script src="app/layouts/renderer-collection.js"></script>
        <script src="app/layouts/vizmap.js"></script>
        <script src="app/layouts/vizsidebar.js"></script>
        <script src="app/layouts/viztrends.js"></script>
        <script src="app/layouts/vizmatrix.js"></script>
        <script src="app/layouts/vizdashboard.js"></script>

        <script src="app/scenarios/attribute-filter-data.js"></script>
        <script src="app/scenarios/scenario.js"></script>
        <script src="app/scenarios/scenario-trends.js"></script>
        
        <script src="app/widgets/wijcheckboxes.js"></script>
        <script src="app/widgets/wijradio.js"></script>
        <script src="app/widgets/wijcombobox.js"></script>
        <script src="app/widgets/wijselect.js"></script>
    
    </head>
    <body>
        <calcite-shell class="calcite-mode-light">
            <calcite-navigation slot="header" id="menu" style="display:none;">
                <calcite-navigation-logo slot="logo"></calcite-navigation-logo>
                <calcite-menu slot="content-start"></calcite-menu>
                <button slot="content-end" id="infoButton" type="button" title="About vizTool" aria-label="About vizTool"><i class="fa-solid fa-circle-info"></i></button>
                <calcite-navigation slot="navigation-secondary">
                    <calcite-menu slot="content-start"></calcite-menu>
                </calcite-navigation>
            </calcite-navigation>
            <!-- Reference-counted lazy-load spinner (see showDataLoadingIndicator/
                 hideDataLoadingIndicator in app.js) - every view's on-demand scenario data
                 fetch already toggles this, it just needed the actual element to show/hide. -->
            <div id="lazy-load-indicator" style="display:none;">
                <span class="lazy-load-label">Loading</span><span class="lazy-load-dot">.</span><span class="lazy-load-dot">.</span><span class="lazy-load-dot">.</span>
            </div>
            <!-- Shown by showNoDataIndicator/hideNoDataIndicator (app.js) when a view finishes
                 loading but the current scenario/attribute/filter combination has nothing to
                 show - stays up until the layout finds data or the user navigates away. -->
            <div id="no-data-indicator" style="display:none;">
                <span id="no-data-message"></span>
            </div>
            <!-- Progress container centered -->
            <div id="load-screen" style="display:none;">
                <div id="progress-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
                    <div><h1>Welcome to the vizTool!</h1></div>
                    <table>
                        <tr>
                            <td align="right">
                                <label for="progress-geo">Loading Geo Data:</label>
                            </td>
                            <td>
                                <progress id="progress-geo" value="0" max="100"></progress>
                                <span id="progress-text-geo">0%</span>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <label for="progress">Loading Scenario Data:</label>
                            </td>
                            <td>
                                <progress id="progress" value="0" max="100"></progress>
                                <span id="progress-text">0%</span>
                            </td>
                        </tr>
                    </table>
                    <!-- Neither progress bar above moves while loadMenuAndItems() (app.js) is
                         synchronously constructing every menu item/model entity/sidebar - that
                         can take a couple of seconds on its own, between the geo bar finishing
                         and the scenario bar starting, with nothing on screen to show the app
                         is still doing something. #load-status-spinner is a transform-based CSS
                         animation (styles.css), which the browser's compositor thread keeps
                         running even while that synchronous block occupies the main thread, so
                         it visibly keeps moving through the gap instead of appearing frozen.
                         #load-status-text (set via setLoadStatus() in app.js) names the current
                         phase for the same reason. -->
                    <div id="load-status" style="display:flex; align-items:center; gap:8px; margin-top:12px;">
                        <div id="load-status-spinner"></div>
                        <span id="load-status-text"></span>
                    </div>
                </div>
            </div>
            <div id="main"></div>
        </calcite-shell>
        <!-- Modal Structure-->
        <div id="infoModal" class="modal">
            <div id="info-modal-content" class="modal-content" style="display:none;"></div>
        </div>
        <!-- Reference Map popup - a page-level singleton like #infoModal above. Filter.js's
             openMapPopup()/closeMapPopup() (the "Reference Map" button on any aggregator that
             usesAggregatorFilter() - vizTrends/vizMatrix/vizDashboard) assume this already
             exists in the DOM and just toggle/populate it; #mapPopup's full styling (fixed
             position, size, display:none default) already lived in styles.css with nothing
             ever actually creating the element itself. -->
        <div id="mapPopup"></div>
        <!-- Definitions popup - a page-level singleton like #mapPopup above. VizSidebar's
             openDefinitionsPopup()/closeDefinitionsPopup() (the "Definitions" button under any
             attribute list that has at least one attribute with a config/attributes.json
             "definition") assume this already exists in the DOM and just populate/toggle it. -->
        <div id="definitionsPopup"></div>
        <script>
            // Simple script to show the modal
            document.addEventListener('DOMContentLoaded', function() {
                var modal = document.getElementById('infoModal');
                var okButton = document.getElementById('okButton');
                
                // Show the modal
                modal.style.display = 'block';
                // Check if okButton exists before setting onclick

                if (okButton) {
                    okButton.onclick = function() {
                        modal.style.display = 'none';
                    };
                } else {
                    console.warn('okButton not found in the DOM.');
                }
            });
        </script>
    </body>
</html>
